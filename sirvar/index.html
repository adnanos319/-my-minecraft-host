<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستضيف ماين كرافت المجاني</title>
    <style>
        /* تصميم الموقع بالكامل (CSS) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 { color: #4caf50; margin-bottom: 30px; }
        p { color: #cccccc; font-size: 18px; }
        .btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }
        .btn:hover { background-color: #45a049; transform: scale(1.05); }
        .btn:disabled { background-color: #555; cursor: not-allowed; transform: none; }
        #status {
            margin-top: 30px;
            font-size: 18px;
            font-weight: bold;
            color: #ffeb3b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>اصنع سيرفر ماين كرافت مجاني 🚀</h1>
        <p>اضغط على الزر بالأسفل لإنشاء وتشغيل سيرفرك فوراً بدون تعقيد.</p>
        
        <!-- الزر المخصص للتشغيل -->
        <button id="serverBtn" class="btn" onclick="startServer()">اضغط هنا لتشغيل السيرفر</button>
        
        <!-- مكان ظهور النتيجة -->
        <div id="status">السيرفر مغلق حالياً ❌</div>
    </div>

    <script>
        // كود التحكم البرمجي (JavaScript)
        async function startServer() {
            const btn = document.getElementById('serverBtn');
            const statusDiv = document.getElementById('status');
            
            // تغيير شكل الزر أثناء التحميل
            btn.disabled = true;
            statusDiv.innerText = "جاري الاتصال بالنظام وبناء السيرفر، يرجى الانتظار 30 ثانية... ⏳";
            statusDiv.style.color = "#ffeb3b";

            try {
                // هنا نقوم بالاتصال بسيرفر ماين كرافت المجاني في الخلفية
                // ملاحظة: استبدل الرابط أدناه برابط سيرفرك المجاني لاحقاً
                const response = await fetch('https://render.com', { method: 'POST' });
                const data = await response.json();

                if (data.success) {
                    statusDiv.innerText = "✅ تم تشغيل السيرفر بنجاح! \n آي بي الدخول: " + data.ip;
                    statusDiv.style.color = "#4caf50";
                } else {
                    statusDiv.innerText = "❌ حدث خطأ أثناء تشغيل السيرفر.";
                    statusDiv.style.color = "#f44336";
                    btn.disabled = false;
                }
            } catch (error) {
                // للتجربة المحلية بدون باك إند حقيقي الآن، سنقوم بمحاكاة النجاح:
                setTimeout(() => {
                    statusDiv.innerText = "✅ تم تشغيل السيرفر (تجريبي)! \n IP اللعبة: localhost:25565";
                    statusDiv.style.color = "#4caf50";
                }, 3000);
            }
        }
    </script>
</body>
</html>
