<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم بسيرفر ماين كرافت الخاص بي</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a2e; color: white; text-align: center; padding: 50px; }
        .container { background-color: #161625; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0px 4px 10px rgba(0,0,0,0.5); width: 80%; max-width: 500px; }
        h1 { color: #4e9f3d; }
        button { background-color: #4e9f3d; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 20px; width: 100%; }
        button:hover { background-color: #3e8e2f; }
        .status-box { margin-top: 25px; padding: 15px; border-radius: 5px; background-color: #22223b; font-size: 18px; }
        #status { color: #ffdd59; font-weight: bold; }
        #ip-address { color: #00d2d3; display: none; margin-top: 10px; font-family: monospace; font-size: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>موقعي الخاص لإنشاء السيرفرات</h1>
        <p>تحكم بسيرفر ماين كرافت الخاص بك وافتحه الآن مجاناً.</p>
        
        <button onclick="startMyServer()">▶ تشغيل السيرفر (Start)</button>
        
        <div class="status-box">
            حالة السيرفر الحالي: <span id="status">متوقف 🔴</span>
            <div id="ip-address">جاري تجهيز الآيبـي...</div>
        </div>
    </div>

    <script>
        function startMyServer() {
            document.getElementById('status').innerText = "جاري تشغيل السيرفر... 🔄";
            document.getElementById('status').style.color = "#ffdd59";
            
            // محاكاة الاتصال بنظام تشغيل السيرفرات السحابي المجاني
            setTimeout(() => {
                document.getElementById('status').innerText = "يعمل الآن بنجاح 🟢";
                document.getElementById('status').style.color = "#4e9f3d";
                
                // هنا سيظهر الآيبي الافتراضي للسيرفر بعد التشغيل
                var ipBox = document.getElementById('ip-address');
                ipBox.style.display = "block";
                ipBox.innerText = "IP: myserver.freegame.host:25565";
            }, 5000); // السيرفر يفتح خلال 5 ثوانٍ
        }
    </script>
</body>
</html>
