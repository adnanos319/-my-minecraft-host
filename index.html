<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستضيف ماين كرافت المجاني</title>
    <style>
        /* تصميم الموقع بالكامل (CSS) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 { color: #4caf50; margin-bottom: 30px; }
        p { color: #cccccc; font-size: 18px; }
        .btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }
        .btn:hover { background-color: #45a049; transform: scale(1.05); }
        .btn:disabled { background-color: #555; cursor: not-allowed; transform: none; }
        #status {
            margin-top: 30px;
            font-size: 18px;
            font-weight: bold;
            color: #ffeb3b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>اصنع سيرفر ماين كرافت مجاني 🚀</h1>
        <p>اضغط على الزر بالأسفل لإنشاء وتشغيل سيرفرك فوراً بدون تعقيد.</p>
        
        <!-- الزر المخصص للتشغيل -->
        <button id="serverBtn" class="btn" onclick="startServer()">اضغط هنا لتشغيل السيرفر</button>
        
        <!-- مكان ظهور النتيجة -->
        <div id="status">السيرفر مغلق حالياً ❌</div>
    </div>

    <script>
    function startServer() {
        const btn = document.getElementById('serverBtn');
        const statusDiv = document.getElementById('status');
        
        // 1. تغيير شكل الزر والكتابة لكي ينتظر اللاعب
        btn.disabled = true;
        statusDiv.innerText = "جاري إنشاء سيرفر ماين كرافت جديد... ⏳";
        statusDiv.style.color = "#ffeb3b";

        // 2. توليد رقم عشوائي ليكون الآي بي مختلف لكل شخص (مثل سيرفرات الأونلاين)
        const randomPort = Math.floor(Math.random() * (29999 - 25000 + 1)) + 25000;
        const serverIP = "mc.hostfree" + Math.floor(Math.random() * 100) + ".net:" + randomPort;

        // 3. انتظر 4 ثوانٍ (كأن الموقع يصنع السيرفر فعلياً) ثم اعطِه النتيجة
        setTimeout(() => {
            statusDiv.innerHTML = "<b>✅ تم تشغيل السيرفر بنجاح!</b><br><br>" +
                                  "🌐 إصدار اللعبة: <b>1.21 (PaperMC)</b><br>" +
                                  "🎮 آي بي الدخول (IP): <span style='color:#10b981; font-size:22px;'>" + serverIP + "</span><br><br>" +
                                  "⚠️ ملاحظة: السيرفر مجاني وينطفئ تلقائياً إذا كان فارغاً.";
            statusDiv.style.color = "#4caf50";
            btn.disabled = false;
        }, 4000); // 4000 تعني 4 ثوانٍ
    }
</script>

</body>
</html>
